<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>µNORMAN SKIF</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body{font-family:system-ui,sans-serif;background:var(--tg-theme-bg-color,#000);color:var(--tg-theme-text-color,#fff);padding:24px 16px;text-align:center;max-width:560px;margin:auto}
  button{font-size:18px;padding:14px 28px;border:0;border-radius:12px;background:var(--tg-theme-button-color,#2ea6ff);color:var(--tg-theme-button-text-color,#fff)}
  #s{margin-top:16px;min-height:1.5em}
  #links a{display:block;margin:8px 0;padding:12px;border-radius:10px;background:var(--tg-theme-secondary-bg-color,#1c1c1e);color:inherit;text-decoration:none}
  #feed{list-style:none;padding:0;text-align:left;font:13px ui-monospace,monospace}
  #feed li{padding:6px 0;border-bottom:1px solid #333;word-break:break-word}
  .fine{opacity:.6;font-size:12px}
</style>
</head>
<body>
<h2>µNORMAN ($uNRMN) SKIF</h2>
<p>Hold ≥10 $uNRMN on Robinhood Chain to enter. The bot keeps checking your wallet.</p>
<button id="go">Connect & Sign</button>
<p id="s"></p>
<div id="links"></div>
<h3 id="live">📈 Live $uNRMN activity</h3>
<ul id="feed"><li>Loading…</li></ul>
<p id="feed-status" class="fine"></p>
<p class="fine">Not financial advice. DYOR. · Contact: <a href="mailto:unrmn@tutamail.com" style="color:inherit">unrmn@tutamail.com</a></p>
<script type="module">
import { EthereumProvider } from "https://esm.sh/@walletconnect/ethereum-provider@2";

const VERIFY_URL = "https://kcxkznquxuqnwjkdbjsm.supabase.co/functions/v1/verify";
const WC_PROJECT_ID = "b1ae71bceaa7aed2c6ace6bc44a75193"; // cloud.reown.com
const TOKEN = "0x7ed16d612215b650434d7e45827cf080ea0d0f63";
const WETH = "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73";
const LINKS = [
  ["🛒 Buy $uNRMN on uToken", "https://utoken.gg/token/unrmn"],
  ["🦄 Swap WETH → $uNRMN (Uniswap)", `https://app.uniswap.org/swap?chain=robinhood&inputCurrency=${WETH}&outputCurrency=${TOKEN}`],
  ["🃏 Mint / reveal µNORMAN cards", "https://utoken.gg/collection/unrmn"],
  ["🛠 Follow the Hybrid-DeFi dApp build (GitHub) — hodlr beta access", "https://github.com/normancomics/uNRMN"],
  ["🥩 $uNRMN × $uFEELSFAKE staking (mint.club)", "https://mint.club/staking/robinhood/1"],
  ["🐸 $uFEELSFAKE (mint.club)", "https://mint.club/token/robinhood/UFEELSFAKE"],
  ["🐸 $uPEPECASH (mint.club)", "https://mint.club/nft/robinhood/UPEPECASH"],
  ["💬 $uNRMN chat on uToken", "https://utoken.gg/collection/unrmn"],
  ["𝕏 @uNORMANCOMICS", "https://x.com/uNORMANCOMICS"],
  ["𝕏 @KEKBONDS", "https://x.com/KEKBONDS"],
];

const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const s = document.getElementById("s");

// Links (textContent only — nothing user-controlled is ever injected as HTML)
const box = document.getElementById("links");
for (const [label, url] of LINKS) {
  const a = document.createElement("a"); a.href = "#"; a.textContent = label;
  a.onclick = (e) => { e.preventDefault(); tg.openLink(url); };
  box.appendChild(a);
}

// Live activity: uToken trades + collection records + token transfers.
// Each source is read-only and rendered with textContent so source data cannot inject markup.
const ZERO = "0x0000000000000000000000000000000000000000";
const TRANSFER_TOPIC = "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a9df523b3ef";
const RPC_URL = "https://rpc.mainnet.chain.robinhood.com";
const short = (a = "") => a ? a.slice(0, 6) + "…" + a.slice(-4) : "?";
const number = (value, digits = 4) => Number.isFinite(Number(value)) ? Number(value).toLocaleString("en-US", { maximumFractionDigits: digits }) : "?";
const when = (value) => value ? new Date(value).toLocaleString() : "time unavailable";
const feedStatus = document.getElementById("feed-status");

async function json(url, init) {
  const response = await fetch(url, init);
  if (!response.ok) throw new Error(response.status + " from " + url);
  return response.json();
}

async function tradeEvents() {
  const payload = await json("https://utoken.gg/api/tokens/unrmn/trades?page=1&take=100");
  return (payload.trades || []).map((trade) => ({
    id: "trade:" + trade.id,
    order: Number(trade.tsMs || 0),
    kind: String(trade.side || "TRADE").toUpperCase(),
    detail: number(trade.tokenAmount) + " uNRMN · " + (trade.valueQuote != null ? number(trade.valueQuote, 6) + " ETH" : number(trade.valueUsd, 2) + " USD") + " · " + short(trade.maker),
    time: when(trade.tsMs),
  }));
}

async function collectionEvents(sort, kind) {
  const payload = await json("https://utoken.gg/api/tokens/unrmn/assets?sort=" + sort + "&page=1&take=100");
  return (payload.items || []).map((asset) => ({
    id: kind + ":" + asset.assetId + ":" + (asset.mintedMs || asset.movedMs || ""),
    order: Number(asset.mintedMs || asset.movedMs || 0),
    kind,
    detail: "#" + asset.assetId + " · " + short(asset.owner) + (asset.mintTx ? " · " + short(asset.mintTx) : ""),
    time: when(asset.mintedMs || asset.movedMs),
  }));
}

async function blockscoutTransfers() {
  const payload = await json("https://robinhoodchain.blockscout.com/api/v2/tokens/" + TOKEN + "/transfers");
  return (payload.items || []).map((transfer) => {
    const from = transfer.from?.hash || "";
    const to = transfer.to?.hash || "";
    const kind = from.toLowerCase() === ZERO ? "MINT" : to.toLowerCase() === ZERO ? "BURN" : (transfer.method ? String(transfer.method).toUpperCase() : "SEND");
    const decimals = Number(transfer.total?.decimals || 0);
    const amount = transfer.total?.value != null ? number(Number(BigInt(transfer.total.value)) / 10 ** decimals) : (transfer.total?.token_id != null ? "#" + transfer.total.token_id : "?");
    return { id: "transfer:" + (transfer.transaction_hash || transfer.tx_hash || from + to + amount), order: Date.parse(transfer.timestamp || "") || 0, kind, detail: amount + " uNRMN · " + short(from) + " → " + short(to), time: when(transfer.timestamp) };
  });
}

async function rpc(method, params) {
  return (await json(RPC_URL, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }) })).result;
}

async function rpcTransfers() {
  const latestHex = await rpc("eth_blockNumber", []);
  const latest = Number.parseInt(latestHex, 16);
  const logs = await rpc("eth_getLogs", [{ address: TOKEN, fromBlock: "0x" + Math.max(0, latest - 50000).toString(16), toBlock: latestHex, topics: [TRANSFER_TOPIC] }]);
  let decimals = 18;
  try { decimals = Number.parseInt((await rpc("eth_call", [{ to: TOKEN, data: "0x313ce567" }, "latest"])).slice(-2), 16); } catch {}
  return (logs || []).reverse().map((log) => {
    const from = "0x" + log.topics[1].slice(-40);
    const to = "0x" + log.topics[2].slice(-40);
    const amount = number(Number(BigInt(log.data || "0x0")) / 10 ** decimals);
    return { id: "rpc:" + log.transactionHash + ":" + log.logIndex, order: Number.parseInt(log.blockNumber, 16), kind: "SEND", detail: amount + " uNRMN · " + short(from) + " → " + short(to), time: "block " + Number.parseInt(log.blockNumber, 16) };
  });
}

async function transferEvents() {
  try {
    const events = await blockscoutTransfers();
    if (events.length) return events;
  } catch {}
  try { return await rpcTransfers(); } catch { return []; }
}

async function loadFeed() {
  const results = await Promise.allSettled([
    tradeEvents(),
    collectionEvents("newest", "CARD MINTED"),
    collectionEvents("revealed", "LAYER REVEALED"),
    transferEvents(),
  ]);
  const events = results.flatMap((result) => result.status === "fulfilled" ? result.value : []);
  const unique = new Map();
  for (const event of events) if (!unique.has(event.id)) unique.set(event.id, event);
  const ordered = [...unique.values()].sort((a, b) => b.order - a.order).slice(0, 100);
  const ul = document.getElementById("feed");
  ul.replaceChildren();
  if (!ordered.length) {
    ul.appendChild(Object.assign(document.createElement("li"), { textContent: "No live activity returned." }));
  } else {
    for (const event of ordered) {
      const li = document.createElement("li");
      li.className = "event " + event.kind.toLowerCase().replace(/\s+/g, "-");
      li.textContent = event.kind + " · " + event.detail + " · " + event.time;
      ul.appendChild(li);
    }
  }
  feedStatus.textContent = "uToken trades + card/layer records + Blockscout/RPC transfers · refreshed " + new Date().toLocaleTimeString();
}
const refreshFeed = () => loadFeed().catch(() => { feedStatus.textContent = "Live feed unavailable — retrying…"; });
refreshFeed();
setInterval(refreshFeed, 10000);
if (location.hash === "#live") document.getElementById("live").scrollIntoView();

// Verify
document.getElementById("go").onclick = async () => {
  try {
    const initData = tg.initData;
    if (!initData) throw new Error("Open this inside Telegram");
    // Needed so the bot can DM you (e.g. when you hit 10 $uNRMN) if you opened this from inline mode
    if (tg.requestWriteAccess) await new Promise((r) => tg.requestWriteAccess(r));

    const auth = new URLSearchParams(initData).get("auth_date");
    const message = `uNRMN SKIF access\nTelegram ID: ${tg.initDataUnsafe.user.id}\nIssued: ${auth}`;

    const p = await EthereumProvider.init({
      projectId: WC_PROJECT_ID, optionalChains: [4663, 1], showQrModal: true,
      metadata: { name: "uNRMN SKIF", description: "Token gate", url: location.origin, icons: [] },
    });
    await p.connect();
    const [address] = p.accounts;

    s.textContent = "Sign in your wallet…";
    const hex = "0x" + [...new TextEncoder().encode(message)].map(b => b.toString(16).padStart(2, "0")).join("");
    const signature = await p.request({ method: "personal_sign", params: [hex, address] });

    s.textContent = "Checking balance…";
    const r = await (await fetch(VERIFY_URL, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ initData, address, signature }),
    })).json();
    if (!r.ok) throw new Error(r.error);

    s.textContent = "✅ Verified — welcome to the SKIF.";
    if (r.link) tg.openTelegramLink(r.link); else setTimeout(() => tg.close(), 2000);
  } catch (e) { s.textContent = "⚠️ " + (e.message || e); }
};
</script>
</body>
</html>
